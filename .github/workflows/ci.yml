name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install MoonBit toolchain
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            echo "::group::install attempt $attempt"
            if curl -fsSL https://cli.moonbitlang.cn/install/unix.sh | bash; then
              if [ -x "$HOME/.moon/bin/moon" ]; then
                echo "toolchain installed"
                echo "::endgroup::"
                break
              fi
            fi
            echo "::endgroup::"
            echo "attempt $attempt failed"
            if [ "$attempt" -eq 3 ]; then
              echo "giving up after 3 attempts" >&2
              exit 1
            fi
            sleep 15
          done
          echo "$HOME/.moon/bin" >> $GITHUB_PATH
          # Verify in the same step, with an explicit PATH, so a broken install
          # fails here with a clear message instead of in a later step.
          export PATH="$HOME/.moon/bin:$PATH"
          moon version --all

      - name: Update dependencies
        run: moon update

      # --- Acceptance requirement: CI must cover check / build / test ---

      - name: moon check
        run: moon check

      - name: moon build
        run: moon build

      - name: moon test (all backends)
        run: moon test --target all

      # --- Cross-backend evidence (wasm / js) ---

      - name: moon check --target wasm
        run: moon check --target wasm

      - name: moon build --target js
        run: moon build --target js

      # --- Conformance dashboard against the official Hunspell test corpus ---
      # The corpus is NOT vendored (Hunspell is LGPL-2.1); it is cloned into a
      # temp dir at CI time only. See conformance/README.md.
      #
      # This step is intentionally non-blocking: it clones an external repository
      # and runs 150+ suites, so a network hiccup upstream must not mark the build
      # red. The blocking gate for this project is check / build / test above.
      - name: Conformance report
        continue-on-error: true
        run: |
          if [ -f conformance/run.sh ]; then
            bash conformance/run.sh
          else
            echo "conformance harness not implemented yet"
          fi

      # --- Dogfooding: this gate is a BLOCKING step on this repository's own prose ---
      # doccheck exits 0 clean / 1 misspellings / 2 usage or I-O error, and 3 when the
      # wrapper could not fetch the dictionary at all. Failing on 1 and 2 while
      # tolerating 3 is the whole point of separating them: an environment failure must
      # not look like a documentation problem and must not mark the build red.
      # See examples/ci-gate/README.md.
      - name: Spell-check this repository's own documentation
        run: |
          rc=0
          bash examples/doccheck/run.sh --quiet || rc=$?
          if [ "$rc" = "3" ]; then
            echo "::warning::could not obtain the dictionary; doccheck was skipped"
            exit 0
          fi
          if [ "$rc" != "0" ]; then
            echo "::error::doccheck exited $rc"
          fi
          exit "$rc"

      # --- The exit-status contract itself, verified offline (no network, no data) ---
      - name: doccheck exit-status contract
        run: bash examples/ci-gate/run.sh
