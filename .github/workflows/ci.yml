name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install MoonBit toolchain
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            echo "::group::install attempt $attempt"
            if curl -fsSL https://cli.moonbitlang.cn/install/unix.sh | bash; then
              if [ -x "$HOME/.moon/bin/moon" ]; then
                echo "toolchain installed"
                echo "::endgroup::"
                break
              fi
            fi
            echo "::endgroup::"
            echo "attempt $attempt failed"
            if [ "$attempt" -eq 3 ]; then
              echo "giving up after 3 attempts" >&2
              exit 1
            fi
            sleep 15
          done
          echo "$HOME/.moon/bin" >> $GITHUB_PATH
          # Verify in the same step, with an explicit PATH, so a broken install
          # fails here with a clear message instead of in a later step.
          export PATH="$HOME/.moon/bin:$PATH"
          moon version --all

      - name: Update dependencies
        run: moon update

      # --- Acceptance requirement: CI must cover check / build / test ---

      - name: moon check
        run: moon check

      - name: moon build
        run: moon build

      - name: moon test
        run: moon test

      # --- Cross-backend evidence (wasm / js) ---

      - name: moon check --target wasm
        run: moon check --target wasm

      - name: moon build --target js
        run: moon build --target js

      # --- Conformance dashboard against the official Hunspell test corpus ---
      # The corpus is NOT vendored (Hunspell is LGPL-2.1); it is cloned into a
      # temp dir at CI time only. See conformance/README.md.
      - name: Conformance report
        run: |
          if [ -f conformance/run.sh ]; then
            bash conformance/run.sh
          else
            echo "conformance harness not implemented yet"
          fi
